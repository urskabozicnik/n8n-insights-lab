# Larkspur Retail: n8n Enterprise. DB is shared with the ERP, be gentle with it.

name: inslab-bonus-b

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5711:5678"
    environment:
      # --- database ---------------------------------------------------------
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # --- pre-provisioned owner (no setup wizard) --------------------------
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_OWNER_PASSWORD_HASH}

      # --- insights, tuned for a one-hour lab -------------------------------
      # Real defaults are 30 seconds and 60 minutes. With these two values an
      # execution shows up in insights_raw within 5 s and in insights_by_period
      # (what the dashboard reads) within about a minute. On a customer's
      # instance the same journey takes up to an hour, which is the single most
      # common "Insights is delayed" ticket: nothing is wrong.
      N8N_INSIGHTS_FLUSH_INTERVAL_SECONDS: "5"
      N8N_INSIGHTS_COMPACTION_INTERVAL_MINUTES: "1"
      # After the May CPU incident (support ticket T-62514) we throttled the
      # insights compaction job as hard as the docs allow. DBA signed off.
      N8N_INSIGHTS_COMPACTION_BATCH_SIZE: "1"
      N8N_INSIGHTS_COMPACTION_MAX_BATCHES_PER_RUN: "1"
      N8N_INSIGHTS_COMPACTION_BATCH_DELAY_MILLISECONDS: "5000"

      # --- optional licence: uncomment if the facilitator gave you a key -----
      # N8N_LICENSE_ACTIVATION_KEY: ${N8N_LICENSE_ACTIVATION_KEY}

      # --- logging: debug shows "Inserting N insights raw" and compaction runs
      N8N_LOG_LEVEL: debug

      # --- lab hygiene ------------------------------------------------------
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
    volumes:
      - n8n_data:/home/node/.n8n
      # Seed workflows, imported by setup.sh / verify.sh through the n8n CLI.
      - ./workflows:/workflows:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  n8n_data:
